<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Yönetim</title><style>body{font:17px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:20px;background:#f6eee1;color:#4a3628}h1{font-size:24px}label{display:block;font-size:14px;color:#8a6f5a;margin-top:12px}input{width:100%;font:inherit;padding:10px;border:1px solid #cdb79c;border-radius:6px;background:#fff}button,a.b{display:inline-block;font:inherit;font-size:15px;background:#8b5e3c;color:#fff;border:0;border-radius:20px;padding:8px 16px;margin:6px 6px 0 0;cursor:pointer;text-decoration:none}button.k{background:#a33}button.g{background:#fff;color:#4a3628;border:1px solid #cdb79c}.c{background:#fff;border:1px solid #cdb79c;border-radius:10px;padding:12px;margin-top:12px}#msg{color:#a33;margin-top:10px}.s{font-size:14px;color:#8a6f5a}</style></head><body>
<h1>Müşteriler</h1>
<div id="giris"><label for="mk">Yönetici anahtarı</label><input id="mk" type="password" autocomplete="current-password">
<label><input id="hat" type="checkbox" style="width:auto"> Bu telefonda hatırla</label><button id="gir">Giriş</button></div>
<div id="msg" role="alert"></div>
<div id="ust" style="display:none"><a class="b" href="/yeni.html">Yeni müşteri oluştur</a><button class="g" id="cik">Çıkış</button></div>
<div id="liste"></div><button class="g" id="daha" style="display:none">Daha fazla</button>
<script>
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var KEY=localStorage.getItem('mk')||'',cur=null,O=location.origin;
function api(u,o){o=o||{};o.headers={'x-master':KEY};return fetch(u,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function yukle(ilk){
  if(ilk){$('liste').innerHTML='';cur=null}
  api('/api/admin/list'+(cur?'?cursor='+encodeURIComponent(cur):'')).then(function(j){
    $('giris').style.display='none';$('ust').style.display='block';$('msg').textContent='';
    if(ilk&&!j.items.length)$('liste').innerHTML='<p>Henüz müşteri yok.</p>';
    j.items.forEach(function(x){var d=document.createElement('div');d.className='c';d.id='m-'+x.slug;
      var pl=O+'/admin.html?s='+x.slug+'&t='+x.token;
      d.innerHTML='<b>'+esc(x.ana)+' &amp; '+esc(x.es)+'</b><div class="s">'+esc(x.tarih)+' · '+x.yanit+' yanıt · /d/'+esc(x.slug)+'</div>'+
        '<a class="b" target="_blank" href="/d/'+esc(x.slug)+'">Davetiye</a><a class="b" target="_blank" href="'+esc(pl)+'">Panel</a>'+
        '<button class="g" data-k="'+esc(x.slug)+'">Davetiye bağlantısını kopyala</button><button class="g" data-p="'+esc(pl)+'">Panel bağlantısını kopyala</button><button class="k" data-s="'+esc(x.slug)+'">Sil</button>';
      $('liste').appendChild(d)});
    cur=j.cursor;$('daha').style.display=cur?'block':'none';
  }).catch(function(e){$('msg').textContent=(e&&e.error)||'Bağlantı hatası';if(e&&e.error==='Yetkisiz'){localStorage.removeItem('mk');KEY='';$('giris').style.display='block'}});
}
$('gir').onclick=function(){KEY=$('mk').value;if($('hat').checked)localStorage.setItem('mk',KEY);yukle(true)};
$('daha').onclick=function(){yukle(false)};
$('cik').onclick=function(){localStorage.removeItem('mk');location.reload()};
$('liste').onclick=function(e){var b=e.target;
  if(b.dataset.k)navigator.clipboard.writeText(O+'/d/'+b.dataset.k).then(function(){b.textContent='Kopyalandı'});
  if(b.dataset.p)navigator.clipboard.writeText(b.dataset.p).then(function(){b.textContent='Kopyalandı'});
  if(b.dataset.s){var sl=b.dataset.s;if(!confirm(sl+' davetiyesi, yanıtları ve fotoğrafları KALICI olarak silinsin mi?'))return;
    b.disabled=true;b.textContent='Siliniyor…';
    (function dene(){api('/api/admin/sil/'+sl,{method:'POST'}).then(function(j){if(j.kalan)dene();else{var d=$('m-'+sl);d.parentNode.removeChild(d)}}).catch(function(){b.textContent='Silinemedi';b.disabled=false})})()}};
if(KEY)yukle(true);
</script></body></html>
