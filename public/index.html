<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Düğün Davetiyesi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#efe4d3;--paper:#f6eee1;--ink:#4a3628;--soft:#8a6f5a;--seal:#8b5e3c;--rose:#c99a8b;--line:#cdb79c}
body[data-tema=gece]{--bg:#1b2233;--paper:#232c42;--ink:#f0e6d2;--soft:#b9a98a;--seal:#b58a3c;--rose:#d6b46a;--line:#3c4763}
body[data-tema=sage]{--bg:#e4e9dc;--paper:#eff2e8;--ink:#2f3d2c;--soft:#6b7a63;--seal:#5c7a58;--rose:#9db38f;--line:#bccaad}
body[data-tema=gul]{--bg:#f6e3e3;--paper:#fbefef;--ink:#4e2f35;--soft:#9a6b73;--seal:#a8546a;--rose:#d98ea0;--line:#e5c2c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 "Cormorant Garamond",Georgia,serif;text-align:center;padding-top:env(safe-area-inset-top)}
#env{position:fixed;inset:0;z-index:10;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:transform 1.1s cubic-bezier(.7,0,.3,1),opacity .6s .6s}
#env.open{transform:translateY(-100%);opacity:0;pointer-events:none}
.flap{width:min(78vw,340px);aspect-ratio:1.4;position:relative;background:var(--paper);border:1px solid var(--line);box-shadow:0 14px 30px rgba(74,54,40,.18)}
.flap:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,var(--line) 50%) top left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,var(--line) 50%) top right/50% 100% no-repeat}
.seal{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--seal),#fff 25%),var(--seal) 60%,color-mix(in srgb,var(--seal),#000 35%));color:#f3e3cf;border:0;cursor:pointer;font:italic 24px "Cormorant Garamond",serif;box-shadow:0 4px 10px rgba(0,0,0,.3)}
#env p{margin:0;color:var(--soft);font-style:italic}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
main{max-width:480px;margin:0 auto;padding:56px 26px 80px}
section{padding:34px 0;border-bottom:1px solid var(--line)}section:last-child{border:0}
h1{font-weight:400;font-size:58px;line-height:1.02;margin:10px 0}
h1 i{display:block;font-size:26px;color:var(--rose);margin:4px 0}
h2{font-weight:600;font-size:26px;margin:0 0 14px}
.small{color:var(--soft);font-style:italic;margin:0}
.date{font-size:20px;margin:18px 0 0}.date b{display:block;font-size:76px;font-weight:400;line-height:1}
#cd{display:flex;justify-content:center;gap:12px;margin-top:22px}
#cd div{min-width:64px;padding:10px 4px;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
#cd b{display:block;font-size:30px;font-weight:600}#cd span{font-size:14px;color:var(--soft)}
ul{list-style:none;padding:0;margin:0}li{display:flex;gap:16px;padding:9px 0;border-bottom:1px dotted var(--line);text-align:left}li b{min-width:60px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line)}
.btn{display:inline-block;font:inherit;font-size:18px;background:var(--seal);color:#f8eddc;border:0;border-radius:24px;padding:11px 28px;margin-top:14px;text-decoration:none;cursor:pointer}
form{text-align:left;display:grid;gap:12px}label{font-size:16px;color:var(--soft)}
input,textarea{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px}
.choice{display:flex;gap:8px}.choice label{flex:1;margin:0}.choice input{position:absolute;opacity:0;width:0}
.choice span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:3px;color:var(--ink);cursor:pointer}
.choice input:checked+span{background:var(--seal);color:#f8eddc;border-color:var(--seal)}
#ok{color:var(--seal);font-size:21px;text-align:center;min-height:1.5em}
@media (prefers-reduced-motion:reduce){#env{transition:none}}
</style></head><body>
<div id="env"><div class="flap"><button class="seal" id="openBtn" aria-label="Davetiyeyi aç"></button></div><p>Davetiyeyi açmak için mühüre dokunun</p></div>
<div id="app"></div>
<script>
var AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
var slug=location.pathname.split('/')[2]||'';
document.getElementById('openBtn').onclick=function(){$('env').classList.add('open');startMusic()};
var MUZIK='';
function startMusic(){var id=MUZIK;if(!id||!$('yt')||$('ytf'))return;
  $('yt').innerHTML='<iframe id="ytf" width="100%" style="aspect-ratio:16/9;max-width:360px;border:0" src="https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id+'&playsinline=1&enablejsapi=1" allow="autoplay; encrypted-media" title="Şarkı"></iframe>';
  var b=document.createElement('button'),on=true;b.className='btn';b.textContent='♪ Sesi kapat';b.style.cssText='position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;margin:0';
  b.onclick=function(){on=!on;$('ytf').contentWindow.postMessage(JSON.stringify({event:'command',func:on?'playVideo':'pauseVideo',args:''}),'*');b.textContent=on?'♪ Sesi kapat':'♪ Sesi aç'};
  document.body.appendChild(b)}
fetch('/api/inv/'+encodeURIComponent(slug)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){
  $('env').style.display='none';$('app').innerHTML='<main><h2>Davetiye bulunamadı</h2><p>Bağlantıyı kontrol edin.</p></main>'});
function render(C){
  document.body.dataset.tema=C.tema||'klasik';
  var p=C.tarih.split('-'),gun=new Date(C.tarih+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long'});
  document.title=C.ana+' & '+C.es+' – Düğün Davetiyesi';
  $('openBtn').textContent=(C.ana[0]||'')+'&'+(C.es[0]||'');
  var maps=C.harita||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(C.mekan));
  var h='<main><section><p class="small">'+esc(C.baslik||'Evliliğimize sizi bekliyoruz')+'</p><h1>'+esc(C.ana)+'<i>&amp;</i>'+esc(C.es)+'</h1><p>'+esc(C.mesaj)+'</p><p class="date">'+AYLAR[+p[1]-1]+' '+p[0]+', '+esc(gun)+'<b>'+(+p[2])+'</b>Saat '+esc(C.saat)+'</p><div id="cd"><div><b id="d">0</b><span>gün</span></div><div><b id="h">0</b><span>saat</span></div><div><b id="m">0</b><span>dakika</span></div><div><b id="s">0</b><span>saniye</span></div></div></section>';
  if(C.foto.length)h+='<section><h2>Kareler</h2><div class="gal">'+C.foto.map(function(u){return '<img alt="" src="'+esc(u)+'">'}).join('')+'</div></section>';
  h+='<section><h2>Program</h2><ul>'+C.program.map(function(r){return '<li><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></li>'}).join('')+'</ul><p class="small" style="margin-top:16px">'+esc(C.mekan)+'</p><a class="btn" href="'+esc(maps)+'" target="_blank" rel="noopener">Yol tarifi al</a></section>';
  if(C.iban)h+='<section><h2>Hediye ve destek</h2><p>Aramızda olamayacak sevdiklerimiz için hesap bilgilerimiz:</p><p><b>'+esc(C.ibanAd)+'</b><br><span>'+esc(C.iban.replace(/(.{4})/g,'$1 ').trim())+'</span></p><button class="btn" id="kp" type="button">IBAN kopyala</button></section>';
  h+='<section><h2>Katılım</h2><form id="f"><div><label for="ad">Adınız soyadınız</label><input id="ad" required maxlength="80"></div><div class="choice"><label><input type="radio" name="k" value="Katılıyorum" checked><span>Katılıyorum</span></label><label><input type="radio" name="k" value="Katılamıyorum"><span>Katılamıyorum</span></label></div><div><label for="kisi">Kaç kişi geleceksiniz?</label><input id="kisi" type="number" min="1" max="20" value="1"></div><div><label for="not">Notunuz</label><textarea id="not" rows="3" maxlength="400"></textarea></div><button class="btn" style="justify-self:center">Gönder</button><div id="ok" role="status"></div></form></section>';
  if(C.muzik)h+='<section><h2>Bizim şarkımız</h2><div id="yt"></div></section>';
  if(C.album)h+='<section><h2>Anı Albümü</h2><p>Bu özel günün fotoğraf ve videolarını bizimle paylaşın.</p><a class="btn" href="'+esc(C.album)+'" target="_blank" rel="noopener">Fotoğraf veya video yükle</a></section>';
  $('app').innerHTML=h+'</main>';MUZIK=C.muzik||'';if($('env').classList.contains('open'))startMusic();
  var kp=$('kp');if(kp)kp.onclick=function(){var ok=function(){kp.textContent='Kopyalandı'};try{navigator.clipboard.writeText(C.iban).then(ok,function(){prompt('IBAN',C.iban)})}catch(e){prompt('IBAN',C.iban)}};
  $('f').onsubmit=function(e){e.preventDefault();var b=e.target.querySelector('button');b.disabled=true;
    fetch('/api/rsvp/'+encodeURIComponent(slug),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ad:$('ad').value,durum:document.querySelector('input[name=k]:checked').value,kisi:$('kisi').value,not:$('not').value})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})
    .then(function(){$('ok').textContent='Teşekkürler, yanıtınız bize ulaştı.';e.target.reset()})
    .catch(function(j){$('ok').textContent=(j&&j.error)||'Gönderilemedi, tekrar deneyin.'}).then(function(){b.disabled=false})};
  var t0=new Date(C.tarih+'T'+C.saat+':00+03:00').getTime();
  function tick(){var t=Math.max(0,t0-Date.now());$('d').textContent=Math.floor(t/864e5);$('h').textContent=Math.floor(t%864e5/36e5);$('m').textContent=Math.floor(t%36e5/6e4);$('s').textContent=Math.floor(t%6e4/1e3)}
  tick();setInterval(tick,1000);
}
</script></body></html>
